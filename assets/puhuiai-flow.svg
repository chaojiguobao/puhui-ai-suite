</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
<rect width="960" height="430" fill="#07110d"/>
